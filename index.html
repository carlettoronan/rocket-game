<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Lua</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-board" class="fase-plataforma">

        <div id="start-screen">
            <h1>Missão Lua</h1>
            <p>Use ← e →, ou arraste o foguete com o mouse ou dedo.</p>
            <p>Desvie dos obstáculos e sobreviva para marcar pontos.</p>
            <p>Pegue a estrela na fase espacial para pousar na Lua!</p>
            <p>Se deixar uma estrela escapar, a dificuldade aumenta.</p>
            <button id="btn-start">Iniciar Missão</button>
        </div>

        <div id="game-over-screen">
            <h1 id="game-over-title">Fim de jogo</h1>
            <p id="game-over-message"></p>
            <p>Pontuação final: <span id="final-score">0</span></p>
            <button id="btn-restart">Jogar Novamente</button>
        </div>

        <div id="score">
            Pontuação: <span id="score-value">0</span>
        </div>

        <img id="rocket" src="images/Foguete.gif" alt="Foguete">

        <div id="obstacles-container"></div>

    </div>

    <audio id="musica" loop>
        <source src="sounds/musica.mp3" type="audio/mpeg">
    </audio>

    <audio id="som-foguete">
        <source src="sounds/rocket.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>

</html>
