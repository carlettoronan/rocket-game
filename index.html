<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Lua</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- O contêiner principal gerencia as fases pelo nome da classe -->
    <div id="game-board" class="fase-plataforma">
        
        <div id="start-screen">
            <h1>Missão Lua</h1>
            <button id="btn-start">Iniciar Lançamento</button>
        </div>
        
        <!-- A nave controlável -->
        <img id="rocket" src="images/Foguete.gif" alt="Foguete">
        
        <!-- Os detritos/pássaros serão injetados aqui via JS -->
        <div id="obstacles-container"></div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
